# Engine defaults (docs/engine-plan.md §4.3, spec SIM-01). Every value is an initial game
# parameter and can be overridden by the scenario file and then by the run
# configuration before a run starts; the result is frozen into the run manifest.
id: engine
version: 1
schema_version: 1

# Scenario used when none is named (`--scenario default`).
default_scenario: toy

sim:
  seed: 1
  tick_minutes: 1             # one tick = one simulated minute
  start_minute_of_day: 420    # the default scenario starts at 07:00
  ticks_per_second: 5         # playback rate at 1x (2x, 4x and max also available)
  duration: 300               # ticks
  mayor_interval: 30          # ticks (doubled while the server room is Degraded, M6)
  population: 100
  llm_ratio_bp: 5000          # 50 % in basis points (docs/engine-plan.md §4.2)

record:
  snapshot_interval: 30       # full state snapshot every N ticks and at the end

# Local-first inference (SPEC.md Part A §2, §6; docs/contract.md §6–§7). Resident inference is
# always local Ollama on loopback; the paid mayor API stays off unless AIA_ALLOW_PAID_API=1 and
# ANTHROPIC_API_KEY are set where the engine runs. AIA_MAYOR_MODEL and AIA_RESIDENT_MODEL
# override the local model names (for a machine whose Ollama tags differ).
inference:
  mayor_local_model: qwen3:8b
  mayor_api_model: claude-haiku-5-5
  resident_model: qwen3:1.7b
  resident_model_digest: null   # optional sha256 pin of the installed resident model
  mayor_wait_s: 45              # a mayor reply is awaited at most this long, then the mayor holds
  resident_wait_s: 45
  resident_batch_max: 8
