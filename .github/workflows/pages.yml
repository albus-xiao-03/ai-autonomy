# Publishes the playable browser game (game/) to GitHub Pages on every push to main.
# One-time setup by a repo admin: Settings -> Pages -> Source: "GitHub Actions".
# Visitors get the full 3D Boston city; the AI mayor/residents need the local engine and
# Ollama, so on Pages the game runs with its labelled offline civic controller.
name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - id: deployment
        uses: actions/deploy-pages@v4
